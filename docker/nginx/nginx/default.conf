# HTTP -> HTTPS
server {
    listen 80;
    server_name openzetc.zjshjkj.com;

    return 301 https://$host$request_uri;
}


# HTTPS
server {
    listen 443 ssl;
    server_name openzetc.zjshjkj.com;

    # HTTPS 证书
    ssl_certificate /etc/nginx/cert/scs1776824001002_.zjshjkj.com_server.crt;
    ssl_certificate_key /etc/nginx/cert/scs1776824001002_.zjshjkj.com_server.key;

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 增加客户端请求体大小限制
    client_max_body_size 20M;

    # 前端
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://api:5050/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE / 流式响应
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 上传、流式响应超时
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    # MinIO 公共文件
    location /minio/public/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://minio:9000/public/;

        proxy_set_header Host minio:9000;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # 禁止直接访问其他 MinIO 路径
    location /minio/ {
        return 404;
    }
}